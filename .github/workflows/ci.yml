name: CI

# Runs on every pull request, and is reused by release.yml so nothing is
# released from main without passing the same checks.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels that PR's previous run
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      # Unpacked build only: proves electron-builder can package the app
      # without spending time on the installer.
      - name: Package app
        run: npx electron-builder --win --dir --publish never
