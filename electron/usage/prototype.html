<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
<title>SuperPanel — Usage connection test</title>
<style>
body { background:#0a0a0f; color:#fff; font:16px system-ui; margin:28px; }
h1 { font-size:24px; } h2 { font-size:18px; }
section { background:#13131a; border-radius:12px; padding:20px; margin:18px 0; }
p { color:#b0b0c0; } button, select { padding:12px 16px; margin:4px 8px 4px 0; min-height:44px; border-radius:8px; border:1px solid #555; background:#202030; color:#fff; font:inherit; }
button:disabled { opacity:.5; } pre { white-space:pre-wrap; overflow-wrap:anywhere; font:13px monospace; }
.status { min-height:24px; } #notice { color:#00d9ff; }
</style></head><body>
<h1>Usage connection test</h1>
<p>Sign in, then read usage. Close the provider's other apps and read again to verify independent collection. This screen does not enable dashboard cards.</p>
<section data-provider="claude"><h2>Anthropic · Claude</h2>
<button data-action="connect">Connect Claude</button><button data-action="read">Read Claude usage</button><button data-action="disconnect">Disconnect Claude</button>
<label hidden>Workspace <select aria-label="Claude workspace"></select></label>
<p class="status" role="status">Not tested</p><pre></pre></section>
<section data-provider="codex"><h2>OpenAI · Codex</h2>
<button data-action="connect">Connect Codex</button><button data-action="read">Read Codex usage</button><button data-action="choose-runtime">Choose executable</button><button data-action="disconnect">Disconnect Codex</button>
<p class="status" role="status">Not tested</p><pre></pre></section>
<p id="notice" role="status"></p>
<script src="prototype-renderer.js"></script>
</body></html>
